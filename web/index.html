<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Mark-It-All-Down</title>
  <style>
    body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;color:#202124}
    #drop{border:2px dashed #888;border-radius:12px;padding:2rem;text-align:center;margin:1rem 0}
    .row{display:flex;gap:1rem;justify-content:space-between;padding:.5rem;border-bottom:1px solid #ddd;word-break:break-word}
    .row span:first-child{flex:1}.row span:last-child{white-space:nowrap;color:#555}
    .muted{color:#666}button{margin:.25rem;padding:.5rem .8rem}
    fieldset{border:1px solid #bbb;border-radius:8px;margin:1rem 0}
  </style>
</head>
<body>
  <h1>Mark-It-All-Down</h1>
  <p class="muted">Local desktop conversion to Markdown</p>
  <div id="drop">Drop files or folders here<br><button id="chooseFiles">Choose Files</button><button id="chooseFolder">Choose Folder</button></div>
  <input id="files" type="file" multiple hidden>
  <input id="folder" type="file" webkitdirectory multiple hidden>
  <fieldset><legend>Output destination</legend>
    <label><input type="radio" name="dest" value="same" checked> Same folder as source</label>
    <label><input id="chosenDest" type="radio" name="dest" value="chosen"> Chosen output folder</label>
    <button id="pickOutput" type="button">Choose output folder…</button>
    <span id="outputStatus" class="muted"> Same folder</span>
  </fieldset>
  <p><button id="start">Convert to Markdown</button><button id="stop" disabled>Stop</button><button id="clear">Clear</button></p>
  <h2>Queue / Results</h2>
  <ol id="queue"><li class="muted">No files selected.</li></ol>
  <p id="notice" class="muted">Conversions run locally; required optional tools are reported when unavailable.</p>
  <script src="app.js"></script>
</body>
</html>
